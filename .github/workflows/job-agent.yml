name: Daily Job Discovery (Agent 1)

# Runs once a day. Commits the SQLite seen-jobs DB + dated digest back to the
# repo so de-duplication persists across cloud runs.
on:
  schedule:
    # GitHub's scheduled cron is unreliable (can run hours late or skip a slot),
    # so we attempt several times across the morning. De-dup means extra runs
    # add no duplicate leads, and a once-per-day email guard (see main.py) means
    # you still get at most ONE email per day. The first attempt that succeeds
    # delivers your leads; the rest are no-ops.
    # 12:00 UTC = 8:00 AM Eastern (EDT). Bump these +1h in winter for 8 AM EST.
    - cron: "0 12 * * *"     # ~8:00 AM ET
    - cron: "30 13 * * *"    # ~9:30 AM ET (backup)
    - cron: "0 15 * * *"     # ~11:00 AM ET (backup)
    - cron: "0 17 * * *"     # ~1:00 PM ET (last-resort backup)
  workflow_dispatch: {}      # lets you trigger a run manually from the Actions tab

permissions:
  contents: write            # needed to commit the digest + DB back

concurrency:
  group: job-agent
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so the commit-back can rebase safely

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run job discovery
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          # Reused for the daily lead email (same creds as Agent 2's Gmail).
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python -m job_agent.main

      - name: Commit digest + seen-jobs DB
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ || true
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(job-agent): daily digest + dedup DB [skip ci]"
            # Robust push: main may have advanced (another run / a deploy). Rebase
            # our data-only commit onto it (prefer our generated files) and retry.
            # Never fail the build over this — Notion is already updated.
            pushed=0
            for i in 1 2 3 4 5; do
              git fetch origin main --quiet || true
              git rebase -X theirs origin/main || git rebase --abort || true
              if git push origin HEAD:main; then pushed=1; break; fi
              echo "push attempt $i rejected; retrying after rebase..."; sleep 3
            done
            if [ "$pushed" = 1 ]; then
              echo "committed digest + dedup DB"
            else
              echo "::warning::commit-back failed after retries (Notion already updated; no data lost)"
            fi
          fi
